name: CrossDiff checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report build environment
        run: |
          source scripts/project-env.sh
          sw_vers
          swift --version
      - name: Check patch formatting and public source
        run: |
          source scripts/project-env.sh
          git diff --check
          git show --format= --check HEAD
          python3 scripts/audit-publication.py --history
      - name: Check release publishing safeguards
        run: |
          source scripts/project-env.sh
          python3 -m unittest discover -s scripts/tests -p 'test_github_release.py'
      - name: Core behavior checks
        id: core
        run: bash scripts/check.sh
      - name: Diagnose a failed core check
        if: failure() && steps.core.outcome == 'failure'
        run: |
          source scripts/project-env.sh
          xcrun lldb --no-lldbinit --batch -o run -k 'thread backtrace all' -- .build/debug/CrossDiffChecks
      - name: Compile native workflow checks
        run: bash scripts/tests/check-workflow.sh --build-only
      - name: Build and verify local app
        run: |
          bash scripts/build-app.sh
          codesign --verify --deep --strict dist/CrossDiff.app
      - name: Audit application bundle
        run: |
          source scripts/project-env.sh
          python3 scripts/audit-publication.py --history --app dist/CrossDiff.app
