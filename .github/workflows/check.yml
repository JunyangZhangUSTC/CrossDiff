name: CrossDiff checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report build environment
        run: |
          source scripts/project-env.sh
          sw_vers
          swift --version
      - name: Check patch formatting and public source
        run: |
          source scripts/project-env.sh
          git diff --check
          git show --format= --check HEAD
          python3 scripts/audit-publication.py --history
      - name: Check release publishing safeguards
        run: |
          source scripts/project-env.sh
          python3 -m unittest discover -s scripts/tests -p 'test_github_release.py'
          python3 -m unittest discover -s scripts/tests -p 'test_plugin_inventory.py'
      - name: Core behavior checks
        id: core
        run: bash scripts/check.sh
      - name: Diagnose a failed core check
        if: failure() && steps.core.outcome == 'failure'
        run: |
          source scripts/project-env.sh
          xcrun lldb --no-lldbinit --batch -o run -k 'thread backtrace all' -- .build/debug/CrossDiffChecks
      - name: Check plugin packages and processes
        run: |
          bash scripts/tests/check-plugins-core.sh
          bash scripts/tests/check-plugin-runtime.sh
          bash scripts/tests/check-plugin-download.sh
          bash scripts/tests/check-plugin-manager.sh
          bash scripts/tests/check-official-plugins.sh
          bash scripts/tests/check-official-plugin-ui.sh --build-only
          bash scripts/tests/check-pdf.sh
          bash scripts/tests/check-pdf-workflow.sh --build-only

      - name: Folder comparison checks
        run: |
          bash scripts/tests/check-folder-browser.sh
          bash scripts/tests/check-folder-model.sh
          bash scripts/tests/check-folder-performance.sh
          bash scripts/tests/check-folder-workflow.sh --build-only

      - name: Compile wrapped text newline checks
        run: bash scripts/tests/check-newline-workflow.sh --build-only

      - name: Archive comparison checks
        run: |
          bash scripts/tests/check-archives-core.sh
          bash scripts/tests/check-archive-native.sh
          bash scripts/tests/check-archive-plugin.sh
          bash scripts/tests/check-archive-workflow.sh --build-only

      - name: API comparison checks
        run: |
          bash scripts/tests/check-api-import.sh
          bash scripts/tests/check-api-plugin.sh
          bash scripts/tests/check-api-workflow.sh --build-only

      - name: Office comparison checks
        run: |
          bash scripts/tests/check-office-import.sh
          bash scripts/tests/check-office-plugin.sh
          bash scripts/tests/check-office-model.sh
          bash scripts/tests/check-office-workflow.sh --build-only

      - name: Audio comparison checks
        run: |
          source scripts/project-env.sh
          bash scripts/tests/check-audio-plugin.sh
          bash scripts/tests/check-audio-engine.sh
          bash scripts/tests/check-audio-playback.sh
          bash scripts/tests/check-audio-cache.sh
          bash scripts/audio-research/build-matcher.sh
          python3 scripts/audio-research/check-matcher.py
          bash scripts/tests/check-audio-workflow.sh --build-only

      - name: Binary comparison checks
        run: |
          bash scripts/tests/check-binary-core.sh
          bash scripts/tests/check-binary-detection.sh
          bash scripts/tests/check-binary-workflow.sh --build-only

      - name: Video comparison checks
        run: |
          bash scripts/tests/check-video-plugin.sh
          bash scripts/tests/check-video-source.sh
          bash scripts/tests/check-video-workflow.sh --build-only

      - name: Compile native plugin workflow checks
        run: bash scripts/tests/check-plugin-workflow.sh --build-only

      - name: Compile native editor checks
        run: bash scripts/tests/check-editor.sh --build-only

      - name: Compile native text alignment checks
        run: bash scripts/tests/check-alignment.sh --build-only

      - name: Compile native scroll geometry checks
        run: bash scripts/tests/check-scroll-geometry.sh --build-only

      - name: Compile native deletion preview checks
        run: bash scripts/tests/check-deletion-preview.sh --build-only

      - name: Compile native workflow checks
        run: bash scripts/tests/check-workflow.sh --build-only

      - name: Compile new comparison workflow checks
        run: bash scripts/tests/check-new-comparison-workflow.sh --build-only
      - name: Image comparison checks
        run: |
          bash scripts/tests/check-image-comparison.sh
          bash scripts/tests/check-image-matching-bridge.sh
          bash scripts/tests/check-image-matching.sh
      - name: Photography comparison checks
        run: |
          bash scripts/tests/check-photography-plugin.sh
          bash scripts/tests/check-photo-metadata.sh
          bash scripts/tests/check-photo-engine.sh
          bash scripts/tests/check-photo-workflow.sh --build-only
      - name: Compile native image workflow checks
        run: bash scripts/tests/check-image-workflow.sh --build-only
      - name: Compile cross-module integration workflow
        run: bash scripts/tests/check-integration-workflow.sh --build-only
      - name: Build and verify local app
        run: |
          bash scripts/build-app.sh
          bash scripts/build-app.sh --edition base --output dist/editions/base/CrossDiff.app
          codesign --verify --deep --strict dist/CrossDiff.app
          codesign --verify --deep --strict dist/editions/base/CrossDiff.app
          bash scripts/tests/check-bundled-helpers.sh
      - name: Audit application bundle
        run: |
          source scripts/project-env.sh
          python3 scripts/audit-publication.py --history --app dist/CrossDiff.app
